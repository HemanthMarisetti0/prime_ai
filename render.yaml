# Render Blueprint: creates the P.R.I.M.E. backend (Node web service) and frontend (static site).
# Values marked `sync: false` are entered in the Render dashboard when the Blueprint is applied.
# See README → "Deploying to Render".

services:
  - type: web
    name: prime-backend
    runtime: node
    plan: free
    # NODE_ENV=production also applies during the build, so dev dependencies (TypeScript) must be forced in.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @prime/backend build
    startCommand: pnpm --filter @prime/backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FIREBASE_PROJECT_ID
        value: primeai-68a31
      - key: ALLOWED_EMAILS
        sync: false
      # The frontend's URL, e.g. https://prime-frontend.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: NEWS_REGION
        value: IN
      # Optional: a YouTube Data API key used only by the backend.
      - key: YOUTUBE_API_KEY
        sync: false
      # A cloud server has no PC of yours to monitor or control.
      - key: SYSTEM_MONITOR
        value: "false"
      - key: PC_CONTROL
        value: "false"

  - type: web
    name: prime-frontend
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @prime/frontend build
    staticPublishPath: apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The backend's URL, e.g. https://prime-backend.onrender.com (baked in at build time)
      - key: VITE_API_URL
        sync: false
      # Firebase web config is public by design; access is enforced by the backend allowlist.
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyD7rJcDFKuKqmGPbSSWJg18NnEBXi8V8h8
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: primeai-68a31.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: primeai-68a31
      - key: VITE_FIREBASE_APP_ID
        value: 1:1098119833370:web:8102d793f7ff6a7ee3aea3
